[package]
name = "psx-vcd-android"
version = "0.1.0"
edition = "2021"
autobins = false
license = "MIT OR Apache-2.0"
description = "Offline PSX BIN/CUE to VCD engine for Android"

[lib]
name = "psxvcd_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
regex = "1.10"
jni = "0.21.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
